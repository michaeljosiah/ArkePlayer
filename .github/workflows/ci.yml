name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the design master
        run: node design/check.mjs
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.3
          channel: stable
          cache: true
      # One resolution for the whole workspace: the app and its pure-Dart packages.
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - name: Test the pure-Dart packages
        run: dart test
        working-directory: packages/arke_publication
      - name: Test the library
        run: dart test
        working-directory: packages/arke_library
      - name: Test the media readers
        run: dart test
        working-directory: packages/arke_media
      - name: Test the app
        run: flutter test
        working-directory: apps/arke_player

  # The Android build, so the native side (plugins, the media service, signing config) is proven on
  # every push, and an installable APK is there to download. It is signed with the debug key here;
  # the release key never leaves the owner's machine (docs/mvp.md, Decided 2).
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.3
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build the APK
        run: flutter build apk --release
        working-directory: apps/arke_player
      - uses: actions/upload-artifact@v4
        with:
          name: arke-player-apk
          path: apps/arke_player/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
      # One APK per ABI as well: the universal one carries three engines and is 76 MiB, past what a
      # phone session can be sent (30 MiB). The Fold7 and every current phone take arm64-v8a.
      # Flutter numbers these 1000 × ABI + versionCode, so a split install won't take the universal
      # APK over it without an uninstall.
      - name: Build an APK per ABI
        run: flutter build apk --release --split-per-abi
        working-directory: apps/arke_player
      - uses: actions/upload-artifact@v4
        with:
          name: arke-player-apk-arm64
          path: apps/arke_player/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 14
