name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the design master
        run: node design/check.mjs
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.3
          channel: stable
          cache: true
      # One resolution for the whole workspace: the app and its pure-Dart packages.
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - name: Test the pure-Dart packages
        run: dart test
        working-directory: packages/arke_publication
      - name: Test the library
        run: dart test
        working-directory: packages/arke_library
      - name: Test the media readers
        run: dart test
        working-directory: packages/arke_media
      - name: Test the app
        run: flutter test
        working-directory: apps/arke_player

  # The Android build, so the native side (plugins, the media service, signing config) is proven on
  # every push, and an installable APK is there to download. It is signed with a throwaway CI test
  # key, not the upload key, which never leaves the owner's machine (docs/mvp.md, Decided 2).
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.3
          channel: stable
          cache: true
      - run: flutter pub get
      # A private repository's runner is the small one: 7.8 GiB and 11 GB of free disk. The
      # template's -Xmx8G for Gradle, which the Kotlin daemon inherits, overcommitted it: two of
      # three builds on 20 October died with the runner ("received a shutdown signal"). Capped, the
      # two builds still end at 6.3 GiB used and the disk at 98%, so the .NET and Haskell toolchains
      # nothing here uses go first. User-home properties outrank the project's, so this changes CI only.
      - name: Fit Gradle to the runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          free -h && df -h /
          mkdir -p ~/.gradle
          printf '%s\n' 'org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g' 'kotlin.daemon.jvmargs=-Xmx1g' >> ~/.gradle/gradle.properties
      # Each runner makes its own debug key, so one CI APK would not install over another without an
      # uninstall, which clears the library. One test key, kept in the repository's secrets, signs
      # them all instead. Its certificate's SHA-256 starts C1:61:B1:45. Without the secrets (a fork's
      # pull request), the build falls back to the debug key.
      - name: Sign with the CI test key
        env:
          KEYSTORE: ${{ secrets.ARKE_CI_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ARKE_CI_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "No CI test key: the debug key signs this build."; exit 0; fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/ci-test.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=arke-ci-test\nkeyPassword=%s\n' "$RUNNER_TEMP/ci-test.jks" "$PASSWORD" "$PASSWORD" > apps/arke_player/android/key.properties
      # One APK per ABI first: the universal one carries three engines and is 76 MiB, past what a
      # phone session can be sent (30 MiB). The Fold7 and every current phone take arm64-v8a.
      # Flutter numbers these 1000 × ABI + versionCode, so a split install won't take the universal
      # APK over it without an uninstall.
      - name: Build an APK per ABI
        run: flutter build apk --release --split-per-abi
        working-directory: apps/arke_player
      - uses: actions/upload-artifact@v4
        with:
          name: arke-player-apk-arm64
          path: apps/arke_player/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 14
      - name: Build the universal APK
        run: flutter build apk --release
        working-directory: apps/arke_player
      - uses: actions/upload-artifact@v4
        with:
          name: arke-player-apk
          path: apps/arke_player/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
      - if: always()
        run: free -h && df -h /
