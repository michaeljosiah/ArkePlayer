org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# A plugin pulls Android Gradle Plugin 9 onto the build classpath, whose new DSL the Flutter Gradle
# plugin cannot read yet. Opt out until Flutter supports it:
# https://docs.flutter.dev/release/breaking-changes/migrate-to-agp-9
android.newDsl=false
