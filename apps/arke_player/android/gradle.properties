org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# receive_sharing_intent 1.8.1 compiles its Java for 1.8 and its Kotlin for 17, which Kotlin's JVM
# target check refuses. Its targets cannot be aligned from here (AGP finalizes them before and
# refuses them after afterEvaluate), so the check reports instead of failing; D8 turns both into
# Android code. Kotlin's documented escape hatch: https://kotl.in/gradle/jvm/target-validation
kotlin.jvm.target.validation.mode=warning
