name: arke_player
description: "Arke Player: watch, hear, read and play what is made in Arke."
publish_to: none
resolution: workspace

version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  webview_flutter: ^4.14.1
  file_picker: ^13.1.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  arke_publication:
    path: ../../packages/arke_publication
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  video_player: ^2.11.1
  pdfrx: ^2.4.7
  flutter_epub_viewer: ^2.1.0
  # Pinned: 1.9.0's own buildscript puts Android Gradle Plugin 9 and Kotlin 2.4 on the classpath,
  # which the Flutter Gradle plugin cannot build with yet. 1.8.1 has the same API.
  receive_sharing_intent: 1.8.1
  arke_library:
    path: ../../packages/arke_library
  arke_media:
    path: ../../packages/arke_media
  arke_world:
    path: ../../packages/arke_world
  wakelock_plus: ^1.7.0
  fc_native_video_thumbnail: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  # To build world packages in tests, as arke_world's own tests do.
  archive: ^4.5.2
  crypto: ^3.0.7

flutter:
  uses-material-design: true

  # First open's picture (P8a): the app's own, bundled, since no world exists yet.
  assets:
    - assets/images/first-open.jpg
    # The worlds that ship with the app (P9 rule 1): the list, and each world's key art and
    # production pictures, so Available shows offline.
    - assets/worlds/catalogue.json
    - assets/worlds/undersong/
    - assets/worlds/legend-of-dumah/

  # The design's faces (OFL-1.1, licences beside the files): Geist Sans for everything, Jost for
  # the wordmark. Latin only, as the design master vendors them; other scripts fall back to the
  # platform's font.
  fonts:
    - family: Geist Sans
      fonts:
        - asset: assets/fonts/GeistSans-400.ttf
          weight: 400
        - asset: assets/fonts/GeistSans-500.ttf
          weight: 500
        - asset: assets/fonts/GeistSans-600.ttf
          weight: 600
        - asset: assets/fonts/GeistSans-700.ttf
          weight: 700
    - family: Jost
      fonts:
        - asset: assets/fonts/Jost-200.ttf
          weight: 200
        - asset: assets/fonts/Jost-300.ttf
          weight: 300
        - asset: assets/fonts/Jost-400.ttf
          weight: 400
