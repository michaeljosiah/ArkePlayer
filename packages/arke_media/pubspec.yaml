name: arke_media
description: >-
  Reads what a file carries before it is added, with no Flutter: title, author, length, chapters
  and cover from MP4/M4B/M4A/MOV atoms, MP3 ID3v2 tags, and EPUB packages.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.11.1

dependencies:
  archive: ^4.5.2
  arke_publication:
    path: ../arke_publication
  xml: ^7.0.1
dev_dependencies:
  lints: ^6.1.0
  test: ^1.29.0
